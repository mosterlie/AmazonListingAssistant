{% extends "base.html" %}

{% block title %}提醒任务{% endblock %}

{% block content %}
<style>
  .alert-task-card { margin-bottom: 18px; }
  .task-status-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .last-log-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px; font-size:0.82rem; color:#475569; margin-top:10px; line-height:1.7; }
  .switch-label { display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:600; font-size:0.9rem; padding:8px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; }
  .switch-label input { width:17px; height:17px; accent-color:var(--primary); cursor:pointer; }
</style>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; position:sticky; top:64px; z-index:90; background:var(--bg-main); padding:10px 12px; margin-left:-12px; margin-right:-12px; border-radius:0 0 var(--radius-sm) var(--radius-sm); box-shadow:0 2px 8px rgba(15,23,42,0.06);">
  <div>
    <h1 style="font-size:1.4rem; font-weight:700; color:var(--text-main); margin:0;">📧 提醒任务</h1>
    <p style="font-size:0.82rem; color:var(--text-muted); margin:4px 0 0;">配置邮件提醒规则 (定时汇总提醒 / 实时预警提醒), 与「🔔 告警任务」的轮询采集配置相互独立; SMTP 发信账号在「⚙️ 系统管理 → 邮件通知」</p>
  </div>
  <div style="display:flex; gap:10px; flex-shrink:0;">
    <a href="/alert-tasks" class="btn btn-outline" style="text-decoration:none;">🔔 告警任务</a>
    <button class="btn btn-primary" id="refreshRemindersBtn" type="button">🔄 刷新状态</button>
  </div>
</div>

<!-- 提醒卡片由 /api/reminders 下发的 form 统一模板 (sections→fields) 驱动, task_cards.js 通用渲染 -->
<div id="remindersWrap"></div>

<script src="/static/js/task_cards.js?v=20260925_rem1"></script>
<script src="/static/js/reminders.js?v=20260925_rem1"></script>
{% endblock %}
