{% extends "base.html" %}

{% block title %}在线表格{% endblock %}

{% block content %}
<style>
  /* 本页压缩外层留白: 表格紧贴顶部导航 */
  .main-wrapper { margin-bottom: 0 !important; }
  .sheet-wrap { height: calc(100vh - 88px); display: flex; flex-direction: column;
    background:#fff; border:1px solid var(--border-color); border-radius: var(--radius-md);
    overflow: hidden; position: relative; }
  .sheet-frame-box { flex:1; position:relative; min-height:0; }
  .sheet-frame-box iframe { width:100%; height:100%; border:none; display:block; }
  .sheet-wrap.sheet-full { position: fixed; inset: 0; z-index: 2000;
    height: 100vh; width: 100vw; border: none; border-radius: 0; }
  body.sheet-full-mode { overflow: hidden; }
  /* 悬浮迷你出口按钮: 不占行, 悬停才明显 */
  .sheet-pop { position:absolute; top:6px; right:8px; z-index:6;
    display:inline-flex; align-items:center; gap:3px; padding:2px 8px;
    font-size:0.68rem; color:#64748b; background:rgba(255,255,255,.85);
    border:1px solid #e2e8f0; border-radius:9999px; text-decoration:none;
    opacity:.25; transition:opacity .2s ease; }
  .sheet-pop:hover { opacity:1; color:#0ea5e9; border-color:#7dd3fc; }
  .sheet-expand { position:absolute; top:6px; right:44px; z-index:6;
    display:inline-flex; align-items:center; padding:2px 9px;
    font-size:0.78rem; color:#64748b; background:rgba(255,255,255,.85);
    border:1px solid #e2e8f0; border-radius:9999px; cursor:pointer;
    opacity:.25; transition:opacity .2s ease; user-select:none; }
  .sheet-expand:hover { opacity:1; color:#0ea5e9; border-color:#7dd3fc; }
  .sheet-loading { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#fff; z-index:5;
    transition: opacity .35s ease; }
  .sheet-loading.hide { opacity:0; pointer-events:none; }
  .sheet-spinner { width:38px; height:38px; border-radius:50%;
    border:3px solid #e2e8f0; border-top-color:#0ea5e9; animation: sheetSpin .8s linear infinite; }
  @keyframes sheetSpin { to { transform: rotate(360deg); } }
  .sheet-loading .txt { font-size:0.8rem; color:#64748b; }
</style>

<div class="sheet-wrap">
  <div class="sheet-frame-box">
    <div class="sheet-loading" id="sheetLoading">
      <div class="sheet-spinner"></div>
      <div class="txt">正在加载在线表格...</div>
    </div>
    <button class="sheet-expand" id="sheetExpandBtn" onclick="toggleSheetFull()" title="撑满整个窗口">⛶</button>
    <a class="sheet-pop" href="https://docs.qq.com/sheet/DZUhLTndIdmJyY0dH?tab=BB08J2" target="_blank"
       title="新窗口打开">↗</a>
    <iframe id="tencentSheetFrame"
            src="https://docs.qq.com/sheet/DZUhLTndIdmJyY0dH?tab=BB08J2"
            allow="clipboard-read; clipboard-write"
            loading="eager"></iframe>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  (function () {
    var loading = document.getElementById('sheetLoading');
    var frame = document.getElementById('tencentSheetFrame');
    var done = false;
    function hideLoading() {
      if (done) return;
      done = true;
      loading.classList.add('hide');
      setTimeout(function () { loading.style.display = 'none'; }, 400);
    }
    // iframe 内文档加载完成 (跨域时 load 事件仍会触发)
    frame.addEventListener('load', hideLoading);
    // 兜底1: 15s 强制收起, 避免跨域拦截时动画永久遮挡
    setTimeout(hideLoading, 15000);
    // 兜底2: 跨域拦截拿不到内容时提示走新窗口
    setTimeout(function () {
      if (done) return;
      try {
        var doc = frame.contentDocument;
        if (doc && doc.body && doc.body.childElementCount === 0) {
          showToast('内嵌加载可能被拦截, 请点右上角「↗」新窗口打开', 'error');
        }
      } catch (e) { /* 跨域属正常 */ }
    }, 6000);

    // 全屏切换: 撑满整个浏览器窗口 (盖过导航), 再点/ESC 退出
    var wrap = document.querySelector('.sheet-wrap');
    var expandBtn = document.getElementById('sheetExpandBtn');
    window.toggleSheetFull = function () {
      var on = wrap.classList.toggle('sheet-full');
      document.body.classList.toggle('sheet-full-mode', on);
      expandBtn.title = on ? '退出全屏 (ESC)' : '撑满整个窗口';
    };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && wrap.classList.contains('sheet-full')) toggleSheetFull();
    });
  })();
</script>
{% endblock %}
