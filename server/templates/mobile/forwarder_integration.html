{% extends "base_mobile.html" %}

{% block title %}运单管理{% endblock %}

{% block content %}
<!-- 统计 chips -->
<div class="m-chip-row" style="margin-bottom:12px;">
  <span class="m-chip" id="wbStatTransit" style="display:none;"></span>
  <span class="m-chip" id="wbStatSigned" style="display:none;"></span>
  <span class="m-chip" id="wbStatException" style="display:none;"></span>
</div>

<!-- 入库工具栏 -->
<div class="m-card" style="margin-bottom:12px;">
  <textarea id="wbPasteInput" class="form-input" rows="2"
    placeholder="粘贴单号入库：支持每行一个 / 逗号分隔，自动识别并查询运输状态"
    style="width:100%; resize:vertical; min-height:56px; font-size:0.9rem; margin-bottom:10px;"></textarea>
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
    <button class="btn btn-primary" id="wbAddBtn" onclick="addWaybills()" type="button" style="min-height:44px; font-size:0.85rem; padding:0 4px;">➕ 入库查询</button>
    {% if 'waybill:sync' in user_perms %}<button class="btn btn-outline" id="wbSyncBtn" onclick="syncMiaoshou()" type="button" style="min-height:44px; font-size:0.85rem; padding:0 4px;">📥 妙手同步</button>{% endif %}
    {% if 'waybill:refresh_all' in user_perms %}<button class="btn btn-outline" id="wbRefreshBtn" onclick="refreshAllWaybills()" type="button" style="min-height:44px; font-size:0.85rem; padding:0 4px;">🔄 刷新状态</button>{% endif %}
  </div>
  <div id="wbAddResult" style="display:none; margin-top:10px; padding:10px 12px; border-radius:8px; background:#fef2f2; border:1px solid #fecaca; font-size:0.76rem; color:#7f1d1d; max-height:140px; overflow:auto;"></div>
</div>

<!-- 搜索栏 -->
<div style="display:flex; gap:8px; margin-bottom:14px;">
  <input type="text" id="wbSearchInput" class="form-input" placeholder="🔍 搜索单号" style="flex:1; min-height:44px; font-size:0.95rem;" onkeydown="if(event.key==='Enter') loadWaybills();">
  <button class="btn btn-outline" onclick="loadWaybills()" type="button" style="min-height:44px; padding:0 16px;">搜索</button>
  <button class="btn btn-outline" onclick="document.getElementById('wbSearchInput').value=''; loadWaybills();" type="button" style="min-height:44px; padding:0 16px;">重置</button>
</div>

<!-- 运单卡片列表 -->
<div class="m-card-list" id="wbCardList">
  <div class="m-card" style="text-align:center; padding:32px; color:#94a3b8;">⏳ 正在加载运单数据...</div>
</div>

<!-- 轨迹时间线弹窗 -->
<div id="trackModal" class="custom-modal m-track-modal" style="display:none;">
  <div class="custom-modal-backdrop" onclick="closeTrackModal()"></div>
  <div class="custom-modal-dialog" style="max-width:94vw; max-height:82vh; display:flex; flex-direction:column;">
    <div class="custom-modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:1.3rem;">📍</span>
        <div>
          <h3 style="margin:0; font-size:1.05rem; color:#0f172a; font-weight:700;">运单轨迹</h3>
          <div style="font-size:0.76rem; color:#64748b; margin-top:2px; word-break:break-all;" id="trackModalSub">—</div>
        </div>
      </div>
      <button class="custom-modal-close" onclick="closeTrackModal()">✕</button>
    </div>
    <div class="custom-modal-body" id="trackModalBody" style="padding:14px 16px; overflow:auto;"></div>
    <div class="custom-modal-footer">
      <button type="button" class="btn btn-outline" onclick="copyTrackText()">📋 复制轨迹文本</button>
      <button type="button" class="btn btn-primary" onclick="closeTrackModal()">关闭</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const IS_ADMIN = {{ 'true' if current_user and current_user.role == 'admin' else 'false' }};
  // RBAC 按钮权限点 (后端注入, admin 为全量)
  const USER_PERMS = {{ user_perms | tojson }};
  function hasPerm(key) { return IS_ADMIN || USER_PERMS.includes(key); }
  let waybills = [];
  let trackModalData = null;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  async function api(url, options = {}) {
    const resp = await fetch(url, {
      headers: { "Content-Type": "application/json" },
      ...options
    });
    if (resp.status === 401) { window.location.href = "/login"; throw new Error("未登录"); }
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok || body.code !== 0) throw new Error(body.detail || body.msg || "请求失败");
    return body;
  }

  function copyText(text, label = "") {
    if (!text) return;
    const done = () => showToast((label ? label + "已复制: " : "已复制: ") + text);
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { showToast("复制失败, 请手动复制", "error"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  }

  /* 单号复制热区 (卡片版) */
  function copyChip(text, placeholder = "—") {
    if (!text) return `<span style="color:#cbd5e1;">${placeholder}</span>`;
    return `<span class="m-copy-chip" title="点击复制" data-v="${escapeHtml(text)}"
              onclick="copyText(this.dataset.v)">${escapeHtml(text)}</span>`;
  }

  /* 单号: 点击复制 + ↗ 跳转外链 (track17=17TRACK / sagawa=佐川急便官网), 先复制再跳转 */
  const SAGAWA_URL = "https://k2k.sagawa-exp.co.jp/p/sagawa/web/okurijoinput.jsp";
  function jumpCell(text, type, placeholder = "—") {
    if (!text) return `<span style="color:#cbd5e1;">${placeholder}</span>`;
    const openAttr = type === "sagawa"
      ? `copyText(this.dataset.v); window.open('${SAGAWA_URL}', '_blank')`
      : `copyText(this.dataset.v); window.open('https://t.17track.net/zh-cn#nums=' + encodeURIComponent(this.dataset.v), '_blank')`;
    const btnTitle = type === "sagawa" ? "复制单号并到佐川急便官网查询" : "复制单号并到 17TRACK 查询";
    return copyChip(text) +
      `<button class="m-jump-btn" type="button" style="margin-left:6px;"
        title="${btnTitle}" data-v="${escapeHtml(text)}" onclick="${openAttr}">↗</button>`;
  }

  function statusBadgeCls(statusName) {
    const n = String(statusName || "");
    if (n.includes("签收") || n.includes("妥投") || n.includes("成功投递")) return "wb-status-signed";
    if (n.includes("派送") || n.includes("末端")) return "wb-status-delivery";
    if (n.includes("异常") || n.includes("退回") || n.includes("扣留") || n.includes("失败")) return "wb-status-exception";
    if (n) return "wb-status-transit";
    return "wb-status-unknown";
  }

  function statusBadge(w) {
    return w.track_status_name
      ? `<span class="wb-status-badge ${statusBadgeCls(w.track_status_name)}">${escapeHtml(w.track_status_name)}</span>`
      : `<span class="wb-status-badge wb-status-unknown">未知</span>`;
  }

  /* ───────── 数据加载与统计 ───────── */
  async function loadWaybills() {
    const listEl = document.getElementById("wbCardList");
    const kw = document.getElementById("wbSearchInput").value.trim();
    try {
      const body = await api("/api/chudao/waybills" + (kw ? `?keyword=${encodeURIComponent(kw)}` : ""));
      waybills = body.data || [];
      renderStats();
      renderWaybills(listEl, kw);
    } catch (e) {
      if (e.message !== "未登录") {
        listEl.innerHTML = `<div class="m-card" style="text-align:center; padding:32px; color:#dc2626;">❌ 加载失败: ${escapeHtml(e.message)}</div>`;
      }
    }
  }

  function renderStats() {
    const count = kw => waybills.filter(w => String(w.track_status_name || "").includes(kw)).length;
    const signed = count("签收") + count("妥投");
    const exception = waybills.filter(w => ["异常", "退回", "扣留", "失败"].some(k => String(w.track_status_name || "").includes(k))).length;
    const transit = waybills.length - signed - exception;
    const setChip = (id, n, label) => {
      const el = document.getElementById(id);
      if (n > 0) { el.style.display = "inline-flex"; el.innerText = `${label} ${n}`; }
      else el.style.display = "none";
    };
    setChip("wbStatTransit", transit, "🚚 运输中");
    setChip("wbStatSigned", signed, "✅ 已签收");
    setChip("wbStatException", exception, "⚠️ 异常");
  }

  /* 卡片式渲染: 一票一卡 */
  function renderWaybills(listEl, kw) {
    if (!waybills.length) {
      listEl.innerHTML = `<div class="m-card" style="text-align:center; padding:32px; color:#94a3b8;">
        📦 运单库为空${kw ? " (无匹配结果)" : ""}，粘贴单号点「➕ 入库查询」添加</div>`;
      return;
    }
    listEl.innerHTML = waybills.map((w, i) => `
      <div class="m-card">
        <div class="m-card-head">
          <span style="flex-shrink:0; color:#94a3b8; font-size:0.75rem; font-weight:700;">${i + 1}</span>
          <span class="m-card-no" style="flex:1;">${copyChip(w.tracking_number, "无货代单号")}</span>
          ${statusBadge(w)}
        </div>
        <div class="m-card-row">
          <span class="m-row-label">跨境</span>
          <span style="flex:1;">${jumpCell(w.channel_hawbcode, "track17")}</span>
        </div>
        <div class="m-card-row">
          <span class="m-row-label">尾程</span>
          <span style="flex:1;">${jumpCell(w.server_hawbcode, "sagawa")}</span>
        </div>
        <div class="m-card-row">
          <span class="m-row-label">目的地</span>
          <span><b>${escapeHtml(w.dest_country || "—")}</b></span>
          <span style="margin-left:auto; color:#94a3b8; font-size:0.7rem;">${escapeHtml((w.updated_at || "").replace("T", " ").slice(0, 16))}</span>
        </div>
        ${w.last_track_desc ? `
        <div class="m-card-row" style="margin-top:4px; padding-top:6px; border-top:1px dashed #e2e8f0;">
          <span class="m-row-label">轨迹</span>
          <span style="flex:1; font-size:0.74rem;">${escapeHtml(w.last_track_desc)}</span>
        </div>` : ""}
        <div class="m-card-foot">
          <button class="btn btn-outline" style="flex:1; min-height:40px; font-size:0.85rem; padding:0;" onclick="showTrack('${escapeHtml(w.tracking_number)}')">📍 轨迹</button>
          <button class="btn btn-outline" style="min-height:40px; padding:0 14px;" onclick="refreshWaybill(${w.id}, '${escapeHtml(w.tracking_number)}')">🔄</button>
          ${hasPerm('waybill:delete') ? `<button class="btn btn-outline" style="min-height:40px; padding:0 14px; color:#ef4444; border-color:#fecaca;" onclick="deleteWaybill(${w.id}, '${escapeHtml(w.tracking_number)}')">🗑️</button>` : ""}
        </div>
      </div>`).join("");
  }

  /* ───────── 入库 / 刷新 / 删除 ───────── */
  async function addWaybills() {
    const input = document.getElementById("wbPasteInput");
    const resultBox = document.getElementById("wbAddResult");
    const numbers = input.value.split(/[\n,，;；\s]+/).map(s => s.trim()).filter(Boolean);
    if (!numbers.length) { showToast("请先粘贴单号", "error"); return; }
    const btn = document.getElementById("wbAddBtn");
    btn.disabled = true; btn.innerText = "⏳ 识别中";
    resultBox.style.display = "none";
    try {
      const body = await api("/api/chudao/waybills", { method: "POST", body: JSON.stringify({ numbers }) });
      const r = body.data || {};
      const parts = [];
      if (r.added && r.added.length) parts.push(`✅ 新增 ${r.added.length} 票`);
      if (r.existing && r.existing.length) parts.push(`ℹ️ 已存在 ${r.existing.length} 票`);
      if (r.failed && r.failed.length) parts.push(`❌ 未识别 ${r.failed.length} 票`);
      showToast(parts.join("，") || "入库完成", r.failed && r.failed.length ? "error" : "success");
      if (r.failed && r.failed.length) {
        resultBox.innerHTML = `<b>以下 ${r.failed.length} 个单号未识别：</b><br>` +
          r.failed.map(f => `• ${escapeHtml(f.number)} — ${escapeHtml(f.reason)}`).join("<br>");
        resultBox.style.display = "block";
      }
      input.value = "";
      loadWaybills();
    } catch (e) {
      if (e.message !== "未登录") showToast("入库失败: " + e.message, "error");
    } finally {
      btn.disabled = false; btn.innerText = "➕ 入库查询";
    }
  }

  async function syncMiaoshou() {
    const btn = document.getElementById("wbSyncBtn");
    const resultBox = document.getElementById("wbAddResult");
    btn.disabled = true; btn.innerText = "⏳ 同步中";
    resultBox.style.display = "none";
    try {
      const body = await api("/api/chudao/waybills/sync-miaoshou", { method: "POST", body: JSON.stringify({}) });
      const r = body.data || {};
      showToast(body.msg || "同步完成", r.failed && r.failed.length ? "error" : "success");
      if (r.failed && r.failed.length) {
        resultBox.innerHTML = `<b>以下 ${r.failed.length} 个单号入库失败：</b><br>` +
          r.failed.map(f => `• ${escapeHtml(f.number)} — ${escapeHtml(f.reason)}`).join("<br>");
        resultBox.style.display = "block";
      }
      loadWaybills();
    } catch (e) {
      if (e.message !== "未登录") showToast("妙手同步失败: " + e.message, "error");
    } finally {
      btn.disabled = false; btn.innerText = "📥 妙手同步";
    }
  }

  async function refreshAllWaybills() {
    const btn = document.getElementById("wbRefreshBtn");
    btn.disabled = true; btn.innerText = "⏳ 刷新中";
    try {
      const body = await api("/api/chudao/waybills/refresh", { method: "POST", body: JSON.stringify({}) });
      const r = body.data || {};
      const failedCnt = (r.failed || []).length + (r.missing || []).length;
      showToast(`已刷新 ${r.refreshed.length} 票` + (failedCnt ? `，${failedCnt} 票查询失败` : ""),
        failedCnt ? "error" : "success");
      loadWaybills();
    } catch (e) {
      if (e.message !== "未登录") showToast("刷新失败: " + e.message, "error");
    } finally {
      btn.disabled = false; btn.innerText = "🔄 刷新状态";
    }
  }

  async function refreshWaybill(id, number) {
    try {
      const body = await api("/api/chudao/waybills/refresh", { method: "POST", body: JSON.stringify({ ids: [id] }) });
      const r = body.data || {};
      if (r.refreshed && r.refreshed.length) showToast(`运单 ${number} 状态已刷新`, "success");
      else showToast(`运单 ${number} 状态查询失败`, "error");
      loadWaybills();
    } catch (e) {
      if (e.message !== "未登录") showToast("刷新失败: " + e.message, "error");
    }
  }

  async function deleteWaybill(id, number) {
    if (!confirm(`确定从运单库删除「${number}」吗？\n删除后可重新粘贴入库。`)) return;
    try {
      await api(`/api/chudao/waybills/${id}`, { method: "DELETE" });
      showToast("运单已删除", "success");
      loadWaybills();
    } catch (e) {
      if (e.message !== "未登录") showToast("删除失败: " + e.message, "error");
    }
  }

  /* ───────── 轨迹时间线弹窗 ───────── */
  async function showTrack(number) {
    const bodyEl = document.getElementById("trackModalBody");
    document.getElementById("trackModalSub").innerText = number;
    bodyEl.innerHTML = `<div style="text-align:center; padding:36px; color:#94a3b8;">⏳ 正在查询轨迹...</div>`;
    document.getElementById("trackModal").style.display = "flex";
    try {
      const body = await api(`/api/chudao/track?number=${encodeURIComponent(number)}`);
      if (body.code !== 0 || !body.data) {
        bodyEl.innerHTML = `<div style="text-align:center; padding:36px; color:#dc2626;">❌ ${escapeHtml(body.msg)}</div>`;
        trackModalData = null;
        return;
      }
      trackModalData = body.data;
      const badgeCls = statusBadgeCls(body.data.track_status_name);
      document.getElementById("trackModalSub").innerHTML =
        `<b style="color:#0f172a;">${escapeHtml(body.data.shipper_hawbcode || number)}</b>` +
        (body.data.track_status_name ? ` · <span class="wb-status-badge ${badgeCls}">${escapeHtml(body.data.track_status_name)}</span>` : "") +
        ` · 目的地 ${escapeHtml(body.data.destination_country || "—")}`;
      const details = body.data.details || [];
      if (!details.length) {
        bodyEl.innerHTML = `<div style="text-align:center; padding:36px; color:#94a3b8;">该运单暂无轨迹记录</div>`;
        return;
      }
      bodyEl.innerHTML = `<div class="wb-timeline">` + details.map(d => `
        <div class="wb-timeline-item">
          <div class="wb-timeline-time">🕐 ${escapeHtml(d.track_occur_date || "")}${d.track_location ? " · " + escapeHtml(d.track_location) : ""}</div>
          <div class="wb-timeline-desc">${escapeHtml(d.track_description || "—")}</div>
        </div>`).join("") + `</div>`;
    } catch (e) {
      if (e.message !== "未登录") {
        bodyEl.innerHTML = `<div style="text-align:center; padding:36px; color:#dc2626;">❌ 查询失败: ${escapeHtml(e.message)}</div>`;
      }
    }
  }

  function copyTrackText() {
    if (!trackModalData) return;
    const lines = [`运单号: ${trackModalData.shipper_hawbcode || ""}`,
      `状态: ${trackModalData.track_status_name || ""}`,
      `目的地: ${trackModalData.destination_country || ""}`, ""];
    (trackModalData.details || []).forEach(d => lines.push(`[${d.track_occur_date || ""}] ${d.track_description || ""}`));
    copyText(lines.join("\n"), "轨迹文本");
  }

  function closeTrackModal() {
    const m = document.getElementById("trackModal");
    if (m) m.style.display = "none";
  }

  loadWaybills();
</script>
{% endblock %}
