<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛狐广告批量投放助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    background:#f1f5f9; color:#0f172a; display:flex; flex-direction:column; overflow:hidden;
  }
  .wrap { max-width:920px; width:100%; margin:0 auto; padding:8px 16px 10px;
          display:flex; flex-direction:column; height:100%; gap:8px; }

  /* 头部 */
  .hdr { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#3b82f6,#2563eb);
         border-radius:12px; padding:12px 16px; color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.25); }
  .hdr .logo { background:rgba(255,255,255,.2); padding:4px 10px; border-radius:6px; font-weight:800; font-size:.85rem; }
  .hdr h1 { font-size:1.05rem; font-weight:700; flex:1; }
  .badge { font-size:.78rem; padding:4px 10px; border-radius:9999px; border:1px solid rgba(255,255,255,.35);
           background:rgba(255,255,255,.15); }
  .badge.ok { background:#ecfdf5; color:#059669; border-color:#a7f3d0; }
  .badge.no { background:#fef2f2; color:#dc2626; border-color:#fecaca; }
  .badge.chk { background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .btn {
    display:inline-flex; align-items:center; gap:4px; border:none; border-radius:8px;
    padding:8px 14px; font-size:.85rem; font-weight:600; cursor:pointer; transition:all .15s;
  }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn-p { background:#2563eb; color:#fff; } .btn-p:hover:not(:disabled){ background:#1d4ed8; }
  .btn-o { background:#fff; color:#334155; border:1px solid #cbd5e1; }
  .btn-o:hover:not(:disabled) { border-color:#2563eb; color:#2563eb; }
  .btn-w { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
  .btn-d { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }

  /* 卡片 */
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:10px 14px; }
  .card-title { display:flex; align-items:center; gap:6px; font-size:.92rem; font-weight:700; color:#0f172a; margin-bottom:8px; }
  .form-grid { display:grid; grid-template-columns:110px 1fr 90px 1fr; gap:8px 10px; align-items:center; }
  .lbl { font-size:.85rem; font-weight:600; color:#334155; text-align:right; }
  .req::after { content:" *"; color:#ef4444; }
  input[type=text], input[type=number], input[type=password] {
    width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:8px 10px;
    font-size:.88rem; outline:none; transition:border .15s; background:#fff; }
  input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  input:disabled { background:#f8fafc; color:#94a3b8; }
  textarea {
    width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:8px 10px;
    font-family:"Menlo",monospace; font-size:.82rem; outline:none; resize:vertical; background:#fff; }
  textarea:focus { border-color:#2563eb; }
  textarea.hint { color:#94a3b8; }
  .hint-row { display:flex; justify-content:space-between; align-items:center; font-size:.78rem; color:#64748b; margin-top:3px; }
  .shop-dd {
    display:none; border:1px solid #e2e8f0; border-radius:8px; background:#fff;
    max-height:150px; overflow:auto; margin-top:2px; box-shadow:0 4px 14px rgba(15,23,42,.12); position:relative; z-index:50; }
  .shop-dd div { padding:7px 12px; font-size:.85rem; cursor:pointer; }
  .shop-dd div:hover { background:#eff6ff; color:#1d4ed8; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg label { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:8px;
    border:1.5px solid #e2e8f0; background:#fff; color:#475569; font-size:.84rem; font-weight:600;
    cursor:pointer; user-select:none; }
  .seg label.on { border-color:#2563eb; background:#eff6ff; color:#1d4ed8; }
  .seg input { accent-color:#2563eb; margin:0; width:auto; }
  .note { font-size:.75rem; color:#94a3b8; }
  .note.w { color:#b45309; }
  .inline-chk { display:flex; gap:14px; align-items:center; font-size:.84rem; color:#334155; }
  .inline-chk label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .inline-chk input { accent-color:#2563eb; width:auto; }

  /* 动作条 */
  .actions { display:flex; align-items:center; gap:10px; }
  .spacer { flex:1; }
  .tag { font-size:.76rem; color:#b45309; background:#fffbeb; border:1px solid #fde68a;
         padding:4px 10px; border-radius:8px; }

  /* 日志 */
  .log-card { flex:1; display:flex; flex-direction:column; min-height:0; }
  #logBox {
    flex:1; min-height:110px; background:#0f172a; color:#cbd5e1; border-radius:8px; padding:8px 10px;
    font-family:"Menlo",monospace; font-size:.74rem; line-height:1.55; overflow-y:auto;
    white-space:pre-wrap; word-break:break-all;
  }
  .log-card .card-title { margin-bottom:6px; }
  #logBox .ok { color:#6ee7b7; } #logBox .err { color:#fca5a5; } #logBox .wr { color:#fcd34d; }

  /* 弹窗 */
  .modal { display:none; position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
           align-items:center; justify-content:center; }
  .modal.show { display:flex; }
  .modal .box { background:#fff; border-radius:12px; padding:18px 20px; max-width:400px; width:90%;
                box-shadow:0 20px 50px rgba(15,23,42,.3); }
  .modal h3 { font-size:.95rem; margin-bottom:10px; }
  .modal p { font-size:.85rem; color:#475569; line-height:1.7; white-space:pre-line; margin-bottom:14px; }
  .modal .row { display:flex; justify-content:flex-end; gap:8px; }
  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200;
           background:#0f172a; color:#fff; padding:9px 16px; border-radius:8px; font-size:.84rem;
           opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:.95; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <span class="logo">SELLFOX</span>
    <h1>赛狐广告批量投放助手</h1>
    <span class="badge chk" id="cdpBadge">🔌 检测中...</span>
    <button class="btn btn-w" id="btnLaunch" onclick="api.launch_browser()" style="display:none">🚀 启动调试浏览器</button>
    <button class="btn btn-o" onclick="api.open_sellfox()" style="background:#fff">② 打开批量创建页</button>
  </div>

  <div class="card">
    <div class="card-title">🌐 浏览器</div>
    <div class="form-grid" style="grid-template-columns:110px 1fr;">
      <span class="lbl">用户数据目录</span>
      <input type="text" id="userDir" value="">
    </div>
    <div class="note" style="margin-top:4px;">登录态与 Cookie 保存在此目录, 与日常浏览器隔离; 换目录即换账号环境。</div>
  </div>

  <div class="card">
    <div class="card-title">📢 投放参数 <span class="note" style="font-weight:400">（全程数据不落库）</span></div>
    <div class="form-grid">
      <span class="lbl req">店铺名称</span>
      <div style="position:relative">
        <input type="text" id="shop" placeholder="点击选择或直接输入店铺名称" autocomplete="off" onfocus="openShopDD()" style="width:100%">
        <div class="shop-dd" id="shopDD"></div>
        <div class="note" id="shopHint" style="margin-top:2px"></div>
      </div>
      <span></span><span></span>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0 2px;">
      <span class="lbl req" style="text-align:left">ASIN 列表</span>
      <span class="note" style="font-size:.78rem">逗号 / 空格 / 换行分隔, 自动转大写</span>
    </div>
    <textarea id="asins" rows="6" placeholder="输入格式：逗号/空格/换行分隔, 如 B0HHRWYPTD,B0HHWJB3X9,B0HHWM14MF"></textarea>
    <div class="hint-row">
      <span id="asinCnt">已识别 0 个 ASIN</span>
      <span class="inline-chk" style="gap:12px">
        <label><input type="checkbox" id="dedup" checked> 自动去重</label>
        <label><input type="checkbox" id="trimVar" checked onchange="document.getElementById('trimKeep').disabled=!this.checked; document.getElementById('trimKeep').parentElement.style.opacity=this.checked?1:.45">
          裁剪变体</label>
        <span>保留 <input type="number" id="trimKeep" value="5" min="1" max="50" style="width:58px; padding:4px 6px;"> 个</span>
      </span>
    </div>

    <div class="form-grid" style="margin-top:8px;">
      <span class="lbl">批次数量</span>
      <div><input type="number" id="batch" value="20" min="1" style="width:90px">
        <span class="note">每批最多录入的 ASIN 数</span></div>
      <span class="lbl">创建方式</span>
      <div class="seg" id="segCreate"></div>
    </div>

    <div class="form-grid" style="margin-top:8px;">
      <span class="lbl req">开始时间</span>
      <input type="date" id="startDate" value="" style="width:150px">
      <span class="lbl">结束时间</span>
      <input type="date" id="endDate" style="width:150px">
      <span class="note" style="grid-column:1/5">结束时间留空 = 不限 (日期框可一键清除)</span>
    </div>

    <div class="form-grid" style="margin-top:8px;">
      <span class="lbl req">每日预算</span>
      <input type="number" id="budget" value="300" min="1" style="width:90px">
      <span class="lbl req">默认竞价</span>
      <input type="number" id="bid" value="15" min="0.01" step="0.01" style="width:90px">
    </div>

    <div class="form-grid" style="margin-top:8px;">
      <span class="lbl">竞价策略</span>
      <div class="seg" id="segBid" style="grid-column:2/5"></div>
    </div>

    <div class="actions" style="margin-top:10px;">
      <button class="btn btn-p" id="btnRun" onclick="api.confirm_run()">▶ 开始投放</button>
      <button class="btn btn-d" id="btnStop" onclick="api.stop()" disabled>⏹ 终止</button>
      <span class="spacer"></span>
      <span class="tag">不提交 · 跑完停在提交前, 人工核对后手动提交</span>
    </div>
  </div>

  <div class="card log-card">
    <div class="card-title">
      📜 执行日志
      <span class="spacer"></span>
      <button class="btn btn-o" style="padding:2px 10px; font-size:.75rem" onclick="api.clear_log()">清空</button>
    </div>
    <div id="logBox"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle">确认投放</h3>
    <p id="mBody"></p>
    <div class="row">
      <button class="btn btn-o" onclick="api.modal(false)">取消</button>
      <button class="btn btn-p" onclick="doConfirm()">确认开始</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ───────── 桥接 (tkinter 版为 window.py_bridge; pywebview 为 window.pywebview.api) ───────── */
function B() {
  if (window.pywebview && window.pywebview.api) return window.pywebview.api;
  if (window.py_bridge) return window.py_bridge;
  throw new Error('bridge not ready');
}

/* 全局 api: onclick 内联调用的统一入口 (pywebview/py_bridge/serve 三模式通吃) */
window.api = {
  launch_browser: () => B().launch_browser(),
  open_sellfox:   () => B().open_sellfox(),
  stop:           () => B().stop(),
  clear_log:      () => { $('logBox').innerText = ''; return B().clear_log(); },
  modal:          show => $('modal').classList.toggle('show', !!show),
  set_user_dir:   d  => B().set_user_dir(d),
  /* 开始投放: 收集参数 → Python 校验 → 通过则弹确认框 */
  confirm_run: async () => {
    const p = collectParams();
    let r;
    try { r = await B().confirm_run(p); }
    catch (e) { toast('调用失败: ' + e.message); return; }
    if (r && r.error) { toast(r.error); return; }
    window._pendingParams = p;
    showModal('确认投放',
      '店铺: ' + (p.shop || '-') + '\n' +
      'ASIN: ' + p.asins.length + ' 个 (批次上限 ' + (p.batch || '不分批') + ')\n' +
      '预算 ' + (p.budget || '-') + ' / 竞价 ' + (p.bid || '-') +
      '\n裁剪: ' + (p.trim_variants ? '开, 保留 ' + p.trim_keep + ' 个' : '不裁剪') +
      '\n\n将驱动赛狐向导录入, 不提交, 停在提交前供人工检查。\n执行期间请勿操作调试 Chrome 窗口。');
  },
};

const $ = id => document.getElementById(id);
const esc = s => (s===null||s===undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg) {
  const t = $('toast'); t.innerText = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ───────── 段选组 ───────── */
function segRender(id, name, options, selected) {
  const box = $(id);
  box.innerHTML = options.map(v =>
    `<label class="${v===selected?'on':''}"><input type="radio" name="${name}" value="${esc(v)}"${v===selected?' checked':''}>${esc(v)}</label>`).join('');
  box.onclick = e => {
    const lb = e.target.closest('label'); if (!lb) return;
    lb.querySelector('input').checked = true;
    box.querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
  };
}
function segValue(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

/* ───────── ASIN 计数 ───────── */
function parseAsinsLocal() {
  const raw = $('asins').value;
  if (raw.includes('输入格式：')) return [];
  const parts = raw.split(/[,，;；\s\r\n\t]+/).map(x=>x.trim().toUpperCase()).filter(Boolean);
  if (!$('dedup').checked) return parts;
  const out = []; new Set(parts).forEach(a => out.push(a));
  return out;
}
function countAsins() {
  const lst = parseAsinsLocal();
  const seen = new Set(); let dup = 0;
  for (const a of lst) { if (seen.has(a)) dup++; seen.add(a); }
  const bad = [...seen].filter(a => !/^[A-Z0-9]{10}$/.test(a));
  let m = `已识别 ${lst.length} 个 ASIN`;
  if (dup) m += ` · 重复 ${dup} 个`;
  if (bad.length) m += ` · ⚠ ${bad.length} 个格式异常: ${esc(bad.slice(0,3).join(', '))}`;
  $('asinCnt').innerText = m;
}

/* ───────── 弹窗/日志 ───────── */
function showLog(lines, cls) {
  const box = $('logBox');
  const span = document.createElement('span');
  span.className = cls || '';
  span.innerText = lines + '\n';
  box.appendChild(span); box.scrollTop = box.scrollHeight;
}
function showModal(title, body) { $('mTitle').innerText = title; $('mBody').innerText = body; $('modal').classList.add('show'); }

function collectParams() {
  return {
    shop: $('shop').value,
    asins: parseAsinsLocal(),
    dedup: $('dedup').checked,
    trim_variants: $('trimVar').checked,
    trim_keep: parseInt($('trimKeep').value || '5', 10),
    batch: parseInt($('batch').value || '0', 10) || 0,
    create_mode: segValue('cm'),
    bid_strategy: segValue('bs'),
    budget: $('budget').value,
    bid: $('bid').value,
    start_date: $('startDate').value,
    end_date: $('endDate').value,
    user_dir: $('userDir').value,
  };
}

async function doConfirm() {
  $('modal').classList.remove('show');
  $('btnRun').disabled = true; $('btnStop').disabled = false;
  try {
    const r = await B().modal_ok();
    if (r === 'no-params' || r === 'running') {
      $('btnRun').disabled = false; $('btnStop').disabled = true;
      toast(r === 'running' ? '任务正在执行中' : '参数已失效, 请重新点击开始投放');
      return;
    }
    pollState();
  } catch (e) {
    $('btnRun').disabled = false; $('btnStop').disabled = true;
    toast('启动失败: ' + e.message);
  }
}
let pollTimer = null;
async function pollState() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      const st = await B().run_state();
      if (!st.running) {
        clearInterval(pollTimer); pollTimer = null;
        $('btnRun').disabled = false; $('btnStop').disabled = true;
        checkCdp();
      }
    } catch (e) { /* ignore */ }
  }, 2000);
}

/* 日志输出 (Python 侧直调 window.pushLog; 浏览器模式走轮询) */
let logSeen = 0, logTimer = null;
/* 统一日志轮询: pywebview 与浏览器模式都走 bridge.poll_logs (增量) */
function startLogPolling() {
  if (logTimer) return;
  logTimer = setInterval(async () => {
    try {
      const r = await B().poll_logs(logSeen);
      const lines = (r && r.lines) || [];
      if (lines.length) {
        showLog(lines.join('\n'));
        logSeen = (r.seen || logSeen) + lines.length;
      }
    } catch (e) { /* ignore */ }
  }, 900);
}

async function initUI() {
  try { B(); } catch (e) { return false; }   // 桥接未就绪则稍后重试
  if (window.__uiInited) return true;
  window.__uiInited = true;
  segRender('segCreate','cm', await B().get_create_modes(), await B().get_default('cm'));
  segRender('segBid','bs', await B().get_bid_strategies(), await B().get_default('bs'));
  const o = await B().get_options();
  $('userDir').value = o.user_dir;
  $('startDate').value = o.today;
  $('shopHint').innerText = o.shop_names.length ? `共 ${o.shop_names.length} 个可选店铺 (点击输入框选择)` : '⚠ 系统未维护店铺';
  window.SHOP_NAMES = o.shop_names;
  $('asins').addEventListener('input', countAsins);
  $('dedup').addEventListener('change', countAsins);
  $('userDir').addEventListener('change', () => B().set_user_dir($('userDir').value));
  startLogPolling();   // 桌面/浏览器模式统一轮询
  checkCdp();
  return true;
}
window.addEventListener('pywebviewready', () => { initUI(); });
/* 兜底: 事件错过/浏览器模式 → 轮询直到桥接就绪 */
(function waitBridge() {
  initUI().then(ok => { if (!ok) setTimeout(waitBridge, 300); });
})();

/* ───────── CDP 状态 ───────── */
async function checkCdp() {
  const b = $('cdpBadge'), lb = $('btnLaunch');
  const ok = await B().check_cdp();
  b.className = 'badge ' + (ok ? 'ok' : 'no');
  b.innerText = ok ? '🟢 调试浏览器已就绪' : '🔴 未检测到调试浏览器';
  lb.style.display = ok ? 'none' : 'inline-block';
}

/* ───────── 店铺下拉 (点击总是展开全部) ───────── */
function openShopDD() {
  const dd = $('shopDD');
  const names = window.SHOP_NAMES || [];
  dd.innerHTML = names.length ? names.map(n =>
    `<div onclick="document.getElementById('shop').value='${esc(n)}';document.getElementById('shopDD').style.display='none'">${esc(n)}</div>`).join('')
    : '<div style="color:#94a3b8">暂无店铺, 请先维护</div>';
  dd.style.display = 'block';
}
document.addEventListener('click', e => {
  const dd = $('shopDD'); if (!dd) return;
  if (e.target.id === 'shop') openShopDD();
  else if (!dd.contains(e.target)) dd.style.display = 'none';
});
</script>
</body>
</html>
